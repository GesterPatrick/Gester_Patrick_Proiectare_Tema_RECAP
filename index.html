<!DOCTYPE html>
<html lang="ro">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width",initial-scale="1">
    <link rel="stylesheet" href="style.css">
    <title>Formular cu API</title>
    <script src="app.js" defer></script>
  </head>

  <body>
    <header>
        <nav> </nav>
    </header>
    <main>
        <h1> Librarie Muzicala</h1>
        <article>
            <h2>Discutii comunitate Pian</h2>
            <div id="status"></div>
            <ul id="ul"></ul>
        </article>

        <article>
            <h2> Creeaza o discutie</h2>

            <form action="https://jsonplaceholder.typicode.com/posts" id="form">
                <label for="titlu">Titlu</label>
                <input type="text" id="titlu" name="titlu"  placeholder="Cauta" minlength="4" required >
                <label for="mesaj">Mesaj</label>
                <textarea id="mesaj" name="mesaj" minlength="10"></textarea>
                
                <button type="submit">Trimite</button>
            </form>
            <div id="status-post"></div>

        </article>
    </main>
    <footer><small>Gester Patrick Arnold 2026</small></footer>
  </body>

</html>
